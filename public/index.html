<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>try { document.documentElement.dataset.theme = localStorage.getItem('gh_theme') === 'light' ? 'light' : 'dark'; } catch (e) {}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GameHub">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="theme-color" content="#0f0b26">
  <title>GameHub — play with friends</title>
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Kalam:wght@400;700&family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    /* The waking-up screen lives here, not in a stylesheet, so it can show before anything else has loaded.
       Kept deliberately calm: the app icon, one turning ring and a line of text. */
    #bootSplash { --text: #f5f2ff; --muted: #b9b1de; --track: rgba(255, 255, 255, .1); --bg1: #2a1559; --bg2: #0e0a24;
      position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 24px;
      color: var(--text); text-align: center; background: radial-gradient(circle at 50% 40%, var(--bg1), var(--bg2) 70%);
      font: 700 16px "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif; opacity: 0; animation: bootIn .4s ease .5s forwards; transition: opacity .35s; }
    #bootSplash.leaving { opacity: 0 !important; animation: none; pointer-events: none; }
    html[data-theme="light"] #bootSplash { --text: #1e1742; --muted: #5d5588; --track: rgba(60, 40, 140, .12); --bg1: #ffffff; --bg2: #e6dffb; }
    #bootSplash .b-mark { position: relative; width: 132px; height: 132px; display: grid; place-items: center; margin-bottom: 12px; }
    #bootSplash .b-mark::before { content: ""; position: absolute; inset: 22px; border-radius: 50%; background: radial-gradient(circle, rgba(124, 77, 255, .55), transparent 70%); filter: blur(10px); animation: bGlow 2.4s ease-in-out infinite; }
    #bootSplash .b-mark img { position: relative; width: 64px; height: 64px; border-radius: 16px; }
    #bootSplash .b-ring { position: absolute; inset: 0; animation: bTurn 1.4s linear infinite; }
    #bootSplash h2 { margin: 0; font: 600 1.8rem/1.1 "Fredoka", "Nunito", system-ui, sans-serif; letter-spacing: .01em; }
    #bootTip { min-height: 1.4em; color: var(--muted); font-weight: 600; transition: opacity .3s; }
    #bootTip.fade { opacity: 0; }
    #bootNote { max-width: 320px; min-height: 2.6em; margin-top: 6px; font-size: .86rem; font-weight: 600; color: var(--muted); opacity: .85; }
    #bootActions button { min-height: 44px; padding: 8px 20px; border: 0; border-radius: 999px; background: #ffc83d; color: #3a2300; font: 600 .95rem "Fredoka", system-ui, sans-serif; cursor: pointer; }
    #bootActions button:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
    @keyframes bootIn { to { opacity: 1; } }
    @keyframes bTurn { to { transform: rotate(360deg); } }
    @keyframes bGlow { 50% { opacity: .55; transform: scale(.88); } }
    @media (prefers-reduced-motion: reduce) {
      #bootSplash *, #bootSplash *::before { animation: none !important; }
      #bootSplash { animation-duration: .01s; }
    }
  </style>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="arena.css">
  <link rel="stylesheet" href="arcade.css">
  <link rel="stylesheet" href="battle-scenes.css">
  <link rel="stylesheet" href="theme-light.css">
</head>
<body>
  <!-- Shown while the server wakes up; quick loads never see it -->
  <div id="bootSplash" role="status" aria-live="polite" aria-busy="true">
    <div class="b-mark" aria-hidden="true">
      <svg class="b-ring" viewBox="0 0 132 132">
        <defs><linearGradient id="bootArc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff2e93"/><stop offset=".5" stop-color="#ffc83d"/><stop offset="1" stop-color="#38c6ff"/></linearGradient></defs>
        <circle cx="66" cy="66" r="60" fill="none" stroke="var(--track)" stroke-width="4"/>
        <circle cx="66" cy="66" r="60" fill="none" stroke="url(#bootArc)" stroke-width="4" stroke-linecap="round" stroke-dasharray="110 267"/>
      </svg>
      <img src="icons/icon.svg" alt="">
    </div>
    <h2>GameHub</h2>
    <div id="bootTip">Getting the games ready…</div>
    <div id="bootNote"></div>
    <div id="bootActions"></div>
  </div>
  <script>
    // Stays up until the server has answered. Written without the app so it runs even while that is still loading.
    (function () {
      var el = document.getElementById('bootSplash');
      var need = { socket: true, catalog: true };
      var tips = ['Getting the games ready…', 'Shuffling the cards…', 'Rolling the dice…', 'Waking the kings…', 'Sharpening the pencils…'];
      var tip = 0, start = Date.now(), done = false;
      var clock = setInterval(function () {
        if (done) return;
        var secs = Math.floor((Date.now() - start) / 1000);
        if (secs >= 6) document.getElementById('bootNote').textContent = 'Our free server naps when nobody is playing. It usually wakes in under a minute.';
        var actions = document.getElementById('bootActions');
        if (secs >= 25 && !actions.firstChild) {
          var open = document.createElement('button');
          open.textContent = 'Open the site while it wakes';
          open.onclick = finish;
          actions.appendChild(open);
        }
        if (secs >= 90 && actions.firstChild && actions.firstChild.textContent !== 'Try again') {
          actions.firstChild.textContent = 'Try again';
          actions.firstChild.onclick = function () { location.reload(); };
        }
        // a gentle swap of the line every few seconds
        if (secs > 0 && secs % 4 === 0) {
          var line = document.getElementById('bootTip');
          line.classList.add('fade');
          setTimeout(function () {
            tip = (tip + 1) % tips.length;
            line.textContent = tips[tip];
            line.classList.remove('fade');
          }, 300);
        }
      }, 1000);
      function finish() {
        if (done) return;
        done = true;
        clearInterval(clock);
        el.setAttribute('aria-busy', 'false');
        el.classList.add('leaving');
        setTimeout(function () { el.remove(); }, 400);
      }
      window.bootMark = function (what) {
        need[what] = false;
        if (!need.socket && !need.catalog) finish();
      };
      // with no internet there is nothing to wait for: Dumb Charades still works
      if (navigator.onLine === false) finish();
      window.addEventListener('offline', finish);
    })();
  </script>
  <header class="topbar">
    <a class="brand" href="/" id="brandLink">
      <img src="icons/icon.svg" width="34" height="34" alt="">
      <span>GameHub</span>
    </a>
    <div id="gameTitle" class="game-title hidden"></div>
    <div class="top-actions">
      <button id="roomChip" class="room-chip hidden" title="Copy invite link"></button>
      <div id="reactDock" class="react-dock hidden">
        <button id="reactBtn" class="icon-btn react-btn" aria-label="Reactions" title="Reactions"></button>
        <div id="reactBar" class="react-bar hidden" role="group" aria-label="Send a reaction"></div>
      </div>
      <button id="soundBtn" class="icon-btn" aria-label="Sound on/off" title="Sound on/off"></button>
      <button id="themeBtn" class="icon-btn" aria-label="Switch light or dark mode" title="Light or dark mode"></button>
      <button id="fsBtn" class="icon-btn" aria-label="Full screen" title="Full screen"></button>
      <button id="menuBtn" class="icon-btn" aria-label="Players and chat" title="Players and chat"></button>
    </div>
  </header>

  <!-- Home -->
  <main id="home" class="page">
    <div class="home-grid">
      <section class="hero">
        <div class="hero-copy">
          <h2 class="logo-word" id="logoWord" aria-label="GameHub">GAMEHUB</h2>
          <p class="hero-tag"><b><span id="gameCount">20</span> games.</b> One room. All your friends.</p>
          <button id="rollBtn" class="btn btn-gold btn-lg">Roll for a game</button>
        </div>
        <button id="dieBtn" class="die-btn" aria-label="Roll the die to pick a random game">
          <span class="die-shadow"></span>
          <span class="cube idle" id="cube"></span>
        </button>
        <section class="panel play-panel">
          <div class="panel-body">
            <h1>Play with friends</h1>
            <label class="field">
              <span>Your name</span>
              <input id="nameInput" maxlength="16" placeholder="Enter your name" autocomplete="nickname">
            </label>
            <p id="pickedGame" class="picked-game hidden"></p>
            <button id="createBtn" class="btn btn-primary btn-lg btn-block">Create room</button>
            <div class="divider"><span>Have a room code?</span></div>
            <div class="join-row">
              <input id="codeInput" maxlength="4" placeholder="ABCD" class="code-input" aria-label="Room code" autocapitalize="characters">
              <button id="joinBtn" class="btn btn-lg">Join</button>
            </div>
            <p id="homeError" class="form-error" role="alert"></p>
          </div>
        </section>
      </section>

      <section class="catalog">
        <div id="catalog"></div>
        <div class="cat-section">
          <h2 class="section-title">Play in person</h2>
          <div class="tile-grid">
            <button id="openCharades" class="tile">
              <span class="tile-art" id="charadesThumb"></span>
              <span class="tile-body"><b>Dumb Charades</b><small>Telugu movies · works offline</small></span>
            </button>
          </div>
        </div>
      </section>
    </div>
    <footer class="site-foot">
      <span>By using GameHub you agree to our</span>
      <a href="/terms">Terms and Conditions</a><span>and</span><a href="/privacy">Privacy Policy</a>
    </footer>
  </main>

  <!-- Room -->
  <main id="room" class="page hidden">
    <div class="room-grid">
      <section id="stage"></section>
      <aside class="sidebar" id="sidebar">
        <div class="drawer-head">
          <div class="dh-title"><span>Game menu</span><button id="drawerClose" class="icon-btn" aria-label="Close menu"></button></div>
          <button id="drawerHowto" class="btn btn-sm"></button>
          <button id="drawerTheme" class="btn btn-sm"></button>
          <button id="drawerEnd" class="btn btn-sm"></button>
        </div>
        <div class="panel" id="playersPanel">
          <div class="panel-head"><span>Players</span><span id="playerCount" class="muted"></span></div>
          <ul id="playerList" class="player-list"></ul>
          <div class="panel-foot">
            <button id="copyLink" class="btn btn-block"></button>
            <button id="leaveBtn" class="btn btn-ghost btn-block"></button>
          </div>
        </div>
        <div class="panel chat" id="chatPanel">
          <div class="panel-head"><span>Chat</span></div>
          <div id="chatLog" class="chat-log" aria-live="polite"></div>
          <form id="chatForm" class="chat-form">
            <input id="chatInput" maxlength="300" placeholder="Send a message" autocomplete="off" aria-label="Chat message">
            <button class="btn btn-icon" aria-label="Send" id="chatSend"></button>
          </form>
        </div>
      </aside>
    </div>
    <div id="reactLayer" class="react-layer" aria-hidden="true"></div>
    <nav id="tabbar" class="tabbar" aria-label="Room sections">
      <button data-tab="game" class="on"></button>
      <button data-tab="players"></button>
      <button data-tab="chat"></button>
    </nav>
  </main>

  <!-- Dumb Charades (offline helper) -->
  <main id="charades" class="page hidden">
    <div class="charades-page">
      <div class="game">
        <div class="game-bar">
          <button id="charadesBack" class="btn btn-sm btn-ghost">← Back</button>
          <span class="title">Dumb Charades</span>
        </div>
        <div class="game-body" id="charadesBody"></div>
      </div>
    </div>
  </main>

  <!-- How to play -->
  <div id="sheet" class="sheet hidden" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-card">
      <div class="sheet-art" id="sheetArt"></div>
      <div class="sheet-body">
        <button class="sheet-close" id="sheetClose" aria-label="Close"></button>
        <small class="sheet-kicker">How to play</small>
        <h3 id="sheetTitle"></h3>
        <p class="sheet-meta" id="sheetMeta"></p>
        <ol class="howto" id="sheetSteps"></ol>
        <div class="sheet-actions" id="sheetActions"></div>
      </div>
    </div>
  </div>

  <div id="netBar" class="net-bar hidden" role="status"><i></i>Reconnecting…</div>
  <div id="toast" class="toast hidden" role="status"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
  <script src="sound.js"></script>
  <script src="games-party.js"></script>
  <script src="games-ipl.js"></script>
  <script src="fx.js"></script>
  <script src="games-arcade.js"></script>
  <script src="battle-scenes.js"></script>
  <script src="games-battle.js"></script>
  <script src="games-telephone.js"></script>
</body>
</html>
