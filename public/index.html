<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GameHub">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="theme-color" content="#262421">
  <title>GameHub — play with friends</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%2381b64c'/><circle cx='11' cy='11' r='3' fill='white'/><circle cx='21' cy='21' r='3' fill='white'/><circle cx='21' cy='11' r='3' fill='white'/><circle cx='11' cy='21' r='3' fill='white'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800;6..12,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" id="brandLink">
      <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#81b64c"/><circle cx="11" cy="11" r="3" fill="#fff"/><circle cx="21" cy="21" r="3" fill="#fff"/><circle cx="21" cy="11" r="3" fill="#fff"/><circle cx="11" cy="21" r="3" fill="#fff"/></svg>
      <span>GameHub</span>
    </a>
    <button id="roomChip" class="room-chip hidden" title="Copy invite link"></button>
  </header>

  <!-- Home -->
  <main id="home" class="page">
    <div class="home-grid">
      <section class="panel play-panel">
        <div class="panel-body">
          <h1>Play with friends</h1>
          <p class="muted">Make a room, send the code, and play together — wherever everyone is.</p>
          <label class="field">
            <span>Your name</span>
            <input id="nameInput" maxlength="16" placeholder="Enter your name" autocomplete="nickname">
          </label>
          <button id="createBtn" class="btn btn-primary btn-lg btn-block">Create room</button>
          <div class="divider"><span>Have a room code?</span></div>
          <div class="join-row">
            <input id="codeInput" maxlength="4" placeholder="ABCD" class="code-input" aria-label="Room code" autocapitalize="characters">
            <button id="joinBtn" class="btn btn-lg">Join</button>
          </div>
          <p id="homeError" class="form-error" role="alert"></p>
        </div>
      </section>

      <section class="catalog">
        <h2 class="section-title">Games</h2>
        <div id="catalog" class="catalog-list"></div>
        <h2 class="section-title" style="margin-top:24px">Play in person</h2>
        <button id="openCharades" class="charades-entry">
          <span class="thumb" id="charadesThumb"></span>
          <span><h4>Dumb Charades — Telugu movies</h4><p>Random Telugu movie names for acting it out together. Timer and team scores included. Works without a room, even offline.</p></span>
        </button>
      </section>
    </div>
  </main>

  <!-- Room -->
  <main id="room" class="page hidden">
    <div class="room-grid">
      <section id="stage"></section>
      <aside class="sidebar">
        <div class="panel" id="playersPanel">
          <div class="panel-head"><span>Players</span><span id="playerCount" class="muted"></span></div>
          <ul id="playerList" class="player-list"></ul>
          <div class="panel-foot">
            <button id="copyLink" class="btn btn-block"></button>
          </div>
        </div>
        <div class="panel chat" id="chatPanel">
          <div class="panel-head"><span>Chat</span></div>
          <div id="chatLog" class="chat-log" aria-live="polite"></div>
          <form id="chatForm" class="chat-form">
            <input id="chatInput" maxlength="300" placeholder="Send a message" autocomplete="off" aria-label="Chat message">
            <button class="btn btn-icon" aria-label="Send" id="chatSend"></button>
          </form>
        </div>
        <button id="leaveBtn" class="btn btn-ghost btn-block"></button>
      </aside>
    </div>
    <nav id="tabbar" class="tabbar" aria-label="Room sections">
      <button data-tab="game" class="on"></button>
      <button data-tab="players"></button>
      <button data-tab="chat"></button>
    </nav>
  </main>

  <!-- Dumb Charades (offline helper) -->
  <main id="charades" class="page hidden">
    <div class="charades-page">
      <div class="game">
        <div class="game-bar">
          <button id="charadesBack" class="btn btn-sm btn-ghost">← Back</button>
          <span class="title">Dumb Charades</span>
        </div>
        <div class="game-body" id="charadesBody"></div>
      </div>
    </div>
  </main>

  <div id="toast" class="toast hidden" role="status"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
