<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GameHub</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎲</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo">🎲 GameHub</div>
    <div id="roomBadge" class="hidden"></div>
  </header>

  <!-- Home -->
  <main id="home" class="screen">
    <section class="hero">
      <h1>Your favourite games, together — from anywhere</h1>
      <p>Housie, Ashta Chamma, Dadi, Bingo, Show and Ramudu-Seetha. Create a room, share the code, play live with friends.</p>
    </section>
    <section class="card narrow">
      <label>Your name
        <input id="nameInput" maxlength="16" placeholder="e.g. Khyati" autocomplete="nickname">
      </label>
      <button id="createBtn" class="primary big">Create a room</button>
      <div class="or">or join a friend</div>
      <div class="row">
        <input id="codeInput" maxlength="4" placeholder="CODE" class="code-input">
        <button id="joinBtn" class="big">Join</button>
      </div>
      <p id="homeError" class="error"></p>
    </section>
  </main>

  <!-- Room: lobby + game -->
  <main id="room" class="screen hidden">
    <div class="layout">
      <div id="stage"></div>
      <aside class="side">
        <div class="card">
          <h3>Players</h3>
          <ul id="playerList" class="players"></ul>
          <div class="share">
            <button id="copyLink">📋 Copy invite link</button>
          </div>
        </div>
        <div class="card chat">
          <h3>Chat</h3>
          <div id="chatLog"></div>
          <form id="chatForm" class="row">
            <input id="chatInput" maxlength="300" placeholder="Say something…" autocomplete="off">
            <button>Send</button>
          </form>
        </div>
        <button id="leaveBtn" class="ghost">Leave room</button>
      </aside>
    </div>
  </main>

  <div id="toast" class="toast hidden"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
